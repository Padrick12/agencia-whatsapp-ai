services:
  postgres_db:
    image: postgres:16-alpine
    container_name: agency_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agencia_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cambia_esta_contrasena_segura_123!}
      POSTGRES_DB: ${POSTGRES_DB:-whatsapp_agency}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - agency-network

networks:
  agency-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
